<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一掷</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      color: #1f2933;
      background: #ffffff;
      line-height: 1.75;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #ffffff;
    }

    main {
      width: min(100% - 32px, 640px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 64px 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h1 {
      margin: 0 0 10px;
      color: #111827;
      font-size: clamp(2rem, 8vw, 3rem);
      line-height: 1.25;
    }

    p { margin: 8px 0 24px; color: #52606d; }

    nav {
      display: grid;
      gap: 12px;
    }

    a {
      display: block;
      padding: 14px 16px;
      border: 1px solid #d8dee6;
      border-radius: 10px;
      color: #245ea8;
      text-decoration: none;
      background: #fafafa;
    }

    a:hover,
    a:focus-visible {
      border-color: #245ea8;
      background: #f3f7fc;
    }

    footer {
      margin-top: 36px;
      color: #667085;
      font-size: 0.9rem;
    }

    @media (max-width: 520px) {
      main { width: min(100% - 24px, 640px); padding: 40px 0; }
    }
  </style>
</head>
<body>
  <main>
    <h1>一掷</h1>
    <p>手机端和手表端的隐私政策及隐私权利公开说明。</p>
    <nav aria-label="公开说明">
      <a href="privacy-policy.html">隐私政策</a>
      <a href="privacy-rights.html">隐私权利说明</a>
    </nav>
    <footer>本页面为无脚本、无外部资源的静态页面。</footer>
  </main>
</body>
</html>
